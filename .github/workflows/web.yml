name: Web app

on:
  push:
    branches: [main]
    paths: ["web/**", "Dockerfile", ".dockerignore", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "Dockerfile", ".dockerignore", ".github/workflows/web.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check the Cloudflare Worker bundles
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t canada-weather-web .
